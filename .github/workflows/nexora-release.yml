# Build Nexora and publish a rolling "nexora-latest" GitHub Release for one-click install
# Standalone builds use Vencord's HTTP updater — release MUST include individual dist
# assets (patcher.js, preload.js, renderer.js, renderer.css) with the hash as the
# last token of the release title (same convention as Vencord DevBuild).
name: Nexora Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nexora-release
  cancel-in-progress: true

env:
  FORCE_COLOR: "true"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        # --standalone = HTTP updater (no git). Required for one-click installs.
        run: pnpm build --standalone

      - name: Pack Windows zip + flat dist assets
        run: |
          set -euo pipefail
          STAGE=nexora-pack
          rm -rf "$STAGE"
          mkdir -p "$STAGE/dist"
          # Runtime bits the Discord loader needs (+ bundled themes)
          cp -a dist/patcher.js dist/preload.js dist/renderer.js dist/renderer.css "$STAGE/dist/"
          cp -a dist/*.LEGAL.txt "$STAGE/dist/" 2>/dev/null || true
          if [ -d dist/themes ]; then
            cp -a dist/themes "$STAGE/dist/"
          fi
          # One-click installer scripts
          cp scripts/windows/Install-Nexora.ps1 scripts/windows/Uninstall-Nexora.ps1 scripts/windows/Install-Nexora.bat "$STAGE/"
          cd "$STAGE"
          zip -r ../Nexora-Windows.zip .
          cd ..
          ls -lh Nexora-Windows.zip
          # Flat copies for Vencord HTTP updater (downloads these by name into dist/)
          cp dist/patcher.js dist/preload.js dist/renderer.js dist/renderer.css .
          cp scripts/windows/Install-Nexora.ps1 scripts/windows/Uninstall-Nexora.ps1 scripts/windows/Install-Nexora.bat .

      - name: Publish nexora-latest release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=nexora-latest
          # Hash MUST be the last whitespace-separated token (Vencord http updater)
          TITLE="Nexora Build $(git rev-parse --short HEAD)"
          NOTES="$(cat <<'EOF'
          ## One-click install (Windows)

          1. Install [Discord desktop](https://discord.com/download) (Stable) and log in once.
          2. Download **Install-Nexora.bat** below (or the full **Nexora-Windows.zip**).
          3. Quit Discord completely (system tray too).
          4. Double-click **Install-Nexora.bat** and follow the prompts.
          5. Open Discord — Nexora settings + bundled themes should be there.

          Updates use the same HTTP updater as Vencord: open Discord, wait for the update toast, restart.

          ### Or PowerShell one-liner
          ```powershell
          irm https://github.com/justhereforagoodtime42/dcc/releases/download/nexora-latest/Install-Nexora.ps1 | iex
          ```

          ### Uninstall
          Download **Uninstall-Nexora.ps1** and run it, or:
          ```powershell
          irm https://github.com/justhereforagoodtime42/dcc/releases/download/nexora-latest/Uninstall-Nexora.ps1 | iex
          ```

          After Discord updates, run the installer again (repair).
          EOF
          )"
          ASSETS=(
            Nexora-Windows.zip
            Install-Nexora.ps1
            Uninstall-Nexora.ps1
            Install-Nexora.bat
            patcher.js
            preload.js
            renderer.js
            renderer.css
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --latest
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --latest
          fi
