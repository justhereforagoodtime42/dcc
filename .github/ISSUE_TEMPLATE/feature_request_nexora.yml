name: Suggest a Feature (Nexora)
description: Propose a Nexora feature with problem, solution, and risks
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is painful today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: benefits
    attributes:
      label: Expected benefits
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Privacy / security implications
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / references
      description: Optional links or descriptions
